[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marswalk"
version = "2.0.0"
description = "MarsWalk 2.0 (Project Atlas) — Planetary Mission Rehearsal, Autonomous Science-Tour Optimizer & Decision-Support System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "rasterio>=1.4.0",
    "affine>=2.4.0",
    "jsonschema>=4.20.0",
    "requests>=2.31.0",
    "websockets>=12.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-p no:launch_testing -p no:launch_testing_ros"
